<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HNN College of Engineering — Campus Navigator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>HNN College of Engineering — Campus Navigator</h2>
    <p>36B Cross, Jayanagar 7th block, Bengaluru - 560070</p>
  </header>

  <div class="layout">
    <!-- Left Control Panel -->
    <div class="box">
      <h3>1. Find Campus Directions</h3>
      <label for="start">Start Location:</label>
      <select id="start"></select>

      <label for="end">Destination:</label>
      <select id="end"></select>

      <label class="check">
        <input type="checkbox" id="noStairs"> Avoid Stairs (Lift / Flat Path Only)
      </label>

      <button type="button" onclick="findRoute()">Get Directions</button>
      <button type="button" style="background:#0f766e; margin-top:6px;" onclick="locateUser()">My Live GPS & Recenter</button>
      <button type="button" style="background:#64748b; margin-top:6px;" onclick="recenterCampus()">Recenter Campus Map</button>

      <div id="output" class="result">Select locations above and click <b>Get Directions</b>.</div>

      <hr>

      <h3>2. Facility Directory</h3>
      <input type="text" id="search" placeholder="Search CSE lab, library, canteen, ATM..." onkeyup="searchPlace()">
      <div id="info" class="info">Select or search a facility to view floor & GPS pin.</div>
    </div>

    <!-- Right Interactive Map Box -->
    <div class="box">
      <h3>Interactive Campus Map <small>(Zoom, Drag & Recenter)</small></h3>
      <iframe id="gmapFrame" src="about:blank" width="100%" height="540" style="border:1px solid #cbd5e1; border-radius:8px;"></iframe>
    </div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
